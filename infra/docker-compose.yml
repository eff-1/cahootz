services:
  postgres:
    image: postgres:16-alpine
    container_name: cahootz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cahootz}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cahootz_dev_pass}
      POSTGRES_DB: ${DB_NAME:-cahootz_dev}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-cahootz} -d ${DB_NAME:-cahootz_dev}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cahootz-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: cahootz-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_HTTP_PORT:-8025}:8025'

volumes:
  postgres_data:
  redis_data:
