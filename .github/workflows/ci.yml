name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-verify:
    name: Unit, Playwright E2E, Audit, Secrets, OWASP ZAP & k6 Load
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.18.1 (Pinned)
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Dependency Vulnerability Audit (npm audit)
        run: npm audit --audit-level=high

      - name: Secrets Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit & Integration Tests (node:test + node:sqlite)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_jwt_secret_must_be_32_chars_minimum!
          REFRESH_SECRET: ci_refresh_secret_must_be_32_chars_minimum!

      - name: Install Headless Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Real Browser E2E & @axe-core/playwright Accessibility Suite
        run: npx playwright test

      - name: Build Pure ES Modules (dist/)
        run: npm run build

      - name: Start Cahootz Server (Compiled Production JS) with Persisted SQLite DB
        run: |
          CAHOOTZ_DB_PATH=./ci-cahootz.sqlite PORT=4100 node dist/apps/api/src/main.js &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4100/api/v1/health >/dev/null 2>&1; then
              echo "Server healthy on port 4100"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4100/api/v1/health

      - name: OWASP ZAP Baseline Scan against Running Server
        run: |
          sudo chmod -R 777 $(pwd)
          touch report_json.json report_md.md report_html.html zap.yaml
          chmod 777 report_json.json report_md.md report_html.html zap.yaml
          docker run --rm -v $(pwd):/zap/wrk/:rw --network=host -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:4100 \
            -c .zap/rules.tsv \
            -J report_json.json \
            -w report_md.md \
            -r report_html.html \
            -a -j -I
          echo "=== OWASP ZAP Baseline Scan Summary ==="
          python3 -c "
          import json, sys
          try:
              with open('report_json.json') as f:
                  data = json.load(f)
              alerts = []
              for site in data.get('site', []):
                  alerts.extend(site.get('alerts', []))
              by_risk = {'High': 0, 'Medium': 0, 'Low': 0, 'Informational': 0}
              for a in alerts:
                  risk = a.get('riskdesc', '').split(' ')[0]
                  if risk in by_risk:
                      by_risk[risk] += 1
                  else:
                      by_risk['Informational'] += 1
              print(f'Total alerts: {len(alerts)}')
              for k, v in by_risk.items():
                  print(f'  {k}: {v}')
          except Exception as e:
              print(f'Could not parse report_json.json: {e}')
          "

      - name: Upload OWASP ZAP Baseline Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            report_json.json
            report_md.md
            report_html.html

      - name: Realistic 5-Minute 100-VU k6 Load Test (Login, Heartbeats, Pings vs Persisted DB)
        run: |
          docker run --rm --network=host -v $(pwd):/scripts -w /scripts grafana/k6:latest run infra/k6/study-together-load.js -e BASE_URL=http://127.0.0.1:4100
