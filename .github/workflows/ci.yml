name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cahootz
          POSTGRES_PASSWORD: cahootz_dev_pass
          POSTGRES_DB: cahootz_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@cahootz/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & Integration Tests
        run: npm run test
        env:
          DATABASE_URL: postgres://cahootz:cahootz_dev_pass@localhost:5432/cahootz_dev
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: dev_jwt_secret_must_be_32_chars_minimum!
          REFRESH_SECRET: dev_refresh_secret_must_be_32_chars_minimum!

      - name: Dependency Audit
        run: npm audit --audit-level=high

