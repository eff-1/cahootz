name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-verify:
    name: Unit, Playwright E2E, Audit, Secrets, OWASP ZAP & k6 Load
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24.18.1 (Pinned)
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Dependency Vulnerability Audit (npm audit)
        run: npm audit --audit-level=high

      - name: Secrets Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit & Integration Tests (node:test + node:sqlite)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_jwt_secret_must_be_32_chars_minimum!
          REFRESH_SECRET: ci_refresh_secret_must_be_32_chars_minimum!

      - name: Install Headless Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Real Browser E2E & @axe-core/playwright Accessibility Suite
        run: npx playwright test

      - name: Start Cahootz Server with Persisted SQLite DB
        run: |
          CAHOOTZ_DB_PATH=./ci-cahootz.sqlite PORT=4100 node --experimental-strip-types apps/api/src/main.ts &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4100/api/v1/health >/dev/null 2>&1; then
              echo "Server healthy on port 4100"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4100/api/v1/health

      - name: OWASP ZAP Baseline Scan against Running Server
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://127.0.0.1:4100'
          cmd_options: '-a -j'
          fail_action: true

      - name: Realistic 5-Minute 100-VU k6 Load Test (Login, Heartbeats, Pings vs Persisted DB)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: infra/k6/study-together-load.js
        env:
          BASE_URL: http://127.0.0.1:4100
